<body>
<div id="app">
  <div id="gameFrame">
    <canvas id="gameCanvas"></canvas>
    <div id="overlayRoot"></div>
    <div id="dpad" class="touchlayer">
      <button id="btnUp" class="dbtn dup">▲</button>
      <button id="btnLeft" class="dbtn dleft">◀</button>
      <button id="btnRight" class="dbtn dright">▶</button>
      <button id="btnDown" class="dbtn ddown">▼</button>
    </div>
    <div id="actionButtons" class="touchlayer">
      <button id="btnCancel" class="abtn">✕</button>
      <button id="btnOk" class="abtn">◯</button>
    </div>
  </div>
</div>
<script src="js/pixelart.js"></script>
<script src="js/audio.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/data.js"></script>
